name: Phase 3 MVP
on:
  pull_request:
    paths:
      - 'cloudflare/phase3/**'
      - 'cloudflare/intel-api/src/daily-policy.ts'
      - 'scripts/phase3/**'
      - 'content/generated/**'
      - 'industry/robotics/skills/**'
      - 'industry/robotics/editorial/**'
      - 'acceptance/phase3-mvp-2026-10-04.json'
      - '.github/workflows/phase3-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test cloudflare/phase3/tests/*.test.mjs
      - run: node scripts/phase3/build.mjs --draft cloudflare/phase3/samples/insight-draft.json
      - run: node scripts/phase3/verify.mjs
      - run: git diff --exit-code -- content/generated
